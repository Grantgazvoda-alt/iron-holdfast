plugins {
    id "com.android.application"
}

android {
    namespace "com.ironholdfast.game"
    compileSdk 36

    defaultConfig {
        applicationId "com.ironholdfast.game"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    sourceSets {
        main {
            assets.srcDirs = ["../../www"]
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
