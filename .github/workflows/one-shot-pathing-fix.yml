name: One-shot pathing fix

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-pathing-fix.mjs
      - .github/workflows/one-shot-pathing-fix.yml
      - tests/release-certification.test.mjs
      - tests/release-regressions.test.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/mobile-store-release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/mobile-store-release
          fetch-depth: 0
      - name: Apply deterministic pathing and wave fixes once
        shell: bash
        run: |
          if grep -q 'Deterministic breadth-first search' src/logic.js; then
            echo 'Pathing fix is already present.'
          else
            node scripts/apply-pathing-fix.mjs
          fi
      - name: Verify syntax and release certification
        run: |
          node --check src/logic.js
          node scripts/check-logic.mjs
          node --test tests/release-certification.test.mjs tests/release-regressions.test.mjs
      - name: Commit verified fix if needed
        shell: bash
        run: |
          if git diff --quiet -- src/logic.js; then
            echo 'No logic change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/logic.js
          git diff --cached --check
          git commit -m 'fix: route units around obstacles and continue waves'
          git push origin HEAD:feature/mobile-store-release
