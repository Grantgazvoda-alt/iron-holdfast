name: Mobile CI

on:
  push:
    branches:
      - feature/mobile-store-release
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android 16 / AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify secure package registry
        run: curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 https://socket-firewall.higgsfield.xyz/npm/typescript >/dev/null
      - name: Install dependencies
        timeout-minutes: 10
        run: bun install
      - name: Test web/server simulation
        run: bun test
      - name: Prepare native assets
        run: bun run mobile:prepare
      - name: Generate Android project
        run: npx cap add android
      - name: Verify target SDK 36
        run: grep -R "targetSdkVersion = 36\|targetSdkVersion 36" android node_modules/@capacitor/android | head -20
      - name: Build Android App Bundle
        working-directory: android
        run: ./gradlew bundleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: iron-holdfast-android-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

  ios:
    name: iOS 26 / simulator build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Verify secure package registry
        run: curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 https://socket-firewall.higgsfield.xyz/npm/typescript >/dev/null
      - name: Install dependencies
        timeout-minutes: 10
        run: bun install
      - name: Prepare native assets
        run: bun run mobile:prepare
      - name: Generate iOS project
        run: npx cap add ios
      - name: Build without signing
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
