name: One-shot command safe-area fix

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-command-safe-area-fix.mjs
      - .github/workflows/one-shot-command-safe-area-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/mobile-store-release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/mobile-store-release
          fetch-depth: 0
      - name: Apply safe-area fix once
        shell: bash
        run: |
          if grep -q 'calc(6px + env(safe-area-inset-top))' public/index.html && grep -q 'env(safe-area-inset-bottom)' public/index.html; then
            echo 'Command safe-area fix is already present.'
          else
            node scripts/apply-command-safe-area-fix.mjs
          fi
      - name: Verify mobile layout and release regressions
        run: |
          grep -q 'env(safe-area-inset-top)' public/index.html
          grep -q 'env(safe-area-inset-left)' public/index.html
          grep -q 'env(safe-area-inset-right)' public/index.html
          grep -q 'env(safe-area-inset-bottom)' public/index.html
          node --test \
            tests/session-certification.test.mjs \
            tests/release-certification.test.mjs \
            tests/release-regressions.test.mjs \
            tests/protocol-certification.mjs
          node scripts/prepare-mobile.mjs
          grep -q 'env(safe-area-inset-top)' mobile/www/index.html
          grep -q 'env(safe-area-inset-bottom)' mobile/www/index.html
      - name: Commit verified fix if needed
        shell: bash
        run: |
          if git diff --quiet -- public/index.html; then
            echo 'No safe-area change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git diff --cached --check
          git commit -m 'fix: respect iPhone safe areas in command mode'
          git push origin HEAD:feature/mobile-store-release
