name: Verify Iron Holdfast

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Deterministic logic contract
        run: bun run check:logic
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Production build
        run: bun run build
