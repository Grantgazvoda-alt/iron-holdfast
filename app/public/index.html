<!doctype html>
<html lang="en" data-theme="default-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic-Tac-Toe</title>
    <!-- og:* metadata is REQUIRED before publishing — an empty og:title makes the
         marketplace card invisible. Fill these in for your game. -->
    <meta property="og:title" content="Tic-Tac-Toe" />
    <meta property="og:description" content="A two-player game of tic-tac-toe." />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0c0e;
        --fg: #f4f4f5;
        --dim: #8b8d94;
        --line: #23262a;
        --accent: #c8fa4b;
        --error: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 1.25rem;
        justify-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        padding: 1.5rem;
      }
      #meta { color: var(--dim); font-size: 0.8125rem; text-align: center; }
      #status { font-size: 1.125rem; font-weight: 600; min-height: 1.5em; }
      #status.error { color: var(--error); }
      #board {
        display: grid;
        grid-template-columns: repeat(3, 5rem);
        grid-template-rows: repeat(3, 5rem);
        gap: 0.5rem;
      }
      .cell {
        font: 600 2rem/1 inherit;
        color: var(--fg);
        background: #14161a;
        border: 1px solid var(--line);
        border-radius: 0.625rem;
        cursor: pointer;
        transition: background 120ms ease, transform 120ms ease;
      }
      .cell:not(:disabled):hover { background: #1b1e23; transform: translateY(-1px); }
      .cell:disabled { cursor: default; opacity: 0.85; }
      .cell.win { border-color: var(--accent); color: var(--accent); }
      #reset {
        font: 600 0.875rem/1 inherit;
        color: #0b0c0e;
        background: var(--accent);
        border: 0;
        border-radius: 999px;
        padding: 0.625rem 1.25rem;
        cursor: pointer;
      }
      @media (prefers-reduced-motion: reduce) {
        .cell { transition: none; }
      }
    </style>
  </head>
  <body>
    <p id="meta"></p>
    <p id="status">connecting…</p>
    <div id="board"></div>
    <button id="reset" type="button">New round</button>
    <script type="module" src="/client.js"></script>
  </body>
</html>
